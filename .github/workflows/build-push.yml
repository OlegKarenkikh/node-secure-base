name: Build & Push Secure Base Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build-push.yml
  schedule:
    # Еженедельная пересборка — подхватывает новые apk патчи
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          tags: |
            olegkarenkikh/node-secure:24-alpine
            olegkarenkikh/node-secure:24-alpine-${{ github.run_number }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb generic main | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy

      - name: Scan with Trivy
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            olegkarenkikh/node-secure:24-alpine
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
